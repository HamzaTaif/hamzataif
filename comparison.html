<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mandatory 3-Column Portrait Halftone Comparison</title>
  <style>
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 30px 20px;
      margin: 0;
    }
    .header {
      text-align: center;
      margin-bottom: 25px;
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      color: #D4A359;
      margin-bottom: 6px;
    }
    p.sub {
      font-family: ui-monospace, monospace;
      font-size: 13px;
      color: #8b949e;
      margin: 0;
    }
    .comparison-grid {
      display: flex;
      gap: 24px;
      justify-content: center;
      align-items: flex-start;
      max-width: 1200px;
      margin: 0 auto;
    }
    .column {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 16px;
      text-align: center;
      flex: 1;
      max-width: 360px;
    }
    h2 {
      font-size: 13px;
      font-family: ui-monospace, monospace;
      color: #F5F4F1;
      margin-top: 0;
      margin-bottom: 14px;
      letter-spacing: 0.5px;
    }
    .img-wrap {
      width: 100%;
      height: 380px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0D0C0A;
      border-radius: 6px;
      overflow: hidden;
    }
    img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>PHOTOGRAPHIC HALFTONE PORTRAIT COMPARISON</h1>
    <p class="sub">1. Girl Reference Target &nbsp;|&nbsp; 2. Hamza Original Photo &nbsp;|&nbsp; 3. New High-Res Continuous Halftone (26,839 Dots)</p>
  </div>

  <div class="comparison-grid">
    <div class="column">
      <h2>1. GIRL REFERENCE TARGET (he.png)</h2>
      <div class="img-wrap">
        <img src="he.png" alt="Girl Reference">
      </div>
    </div>

    <div class="column">
      <h2>2. HAMZA ORIGINAL PHOTO (hamza.png)</h2>
      <div class="img-wrap">
        <img src="hamza.png" alt="Hamza Original Photo">
      </div>
    </div>

    <div class="column">
      <h2>3. NEW HAMZA HALFTONE (assets/portrait-dark.svg)</h2>
      <div class="img-wrap">
        <img src="assets/portrait-dark.svg" alt="New Hamza Halftone SVG">
      </div>
    </div>
  </div>
</body>
</html>
