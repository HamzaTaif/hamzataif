name: GitHub Metrics & 3D Calendar

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate GitHub Metrics & 3D Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: HamzaTaif
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Karachi
          
          # Isometric 3D Calendar Plugin
          plugin_isometric: yes
          plugin_isometric_order: date
          
          # Output SVG directly to repository root
          filename: github-metrics.svg

      - name: Commit and Push Updated Metrics SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add github-metrics.svg
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update 3D contribution metrics SVG" && git push)
