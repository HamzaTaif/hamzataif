name: GitHub Metrics & 3D Calendar

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate GitHub Metrics & 3D Isometric Calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: HamzaTaif
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Karachi
          
          # Isometric 3D Calendar Plugin
          plugin_isometric: yes
          plugin_isometric_order: date
          
          # Output configuration
          filename: github-metrics.svg
