<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 120" width="100%" height="100%">
  <title>APEX DISCIPLINE — Case Study Card</title>

  <!-- Background Card -->
  <rect x="0" y="0" width="850" height="120" rx="8" fill="#0D0C0A" stroke="#3A3935" stroke-width="1" />
  <rect x="0" y="0" width="3" height="120" fill="#8B6F47" />

  <!-- Oversized Index Number -->
  <text x="24" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="800" fill="#8B6F47" letter-spacing="1">02</text>
  <line x1="58" y1="22" x2="58" y2="44" stroke="#3A3935" stroke-width="1" />

  <!-- Title -->
  <text x="70" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800" fill="#F5F4F1" letter-spacing="1">APEX DISCIPLINE</text>
  

  <!-- Description -->
  <text x="24" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="400" fill="#A6A29A">Mobile app for personal discipline and habit tracking with custom UI design.</text>

  <!-- Tech Stack Pills -->
  <g transform="translate(24, 84)">
    <g transform="translate(0, 0)">
          <rect x="0" y="0" width="68.5" height="20" rx="4" fill="rgba(139, 111, 71, 0.08)" stroke="#3A3935" stroke-width="0.8" />
          <text x="34.25" y="13.5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" fill="#8B6F47" text-anchor="middle">Flutter</text>
        </g><g transform="translate(76.5, 0)">
          <rect x="0" y="0" width="46.0" height="20" rx="4" fill="rgba(139, 111, 71, 0.08)" stroke="#3A3935" stroke-width="0.8" />
          <text x="23.0" y="13.5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" fill="#8B6F47" text-anchor="middle">Dart</text>
        </g><g transform="translate(130.5, 0)">
          <rect x="0" y="0" width="121.0" height="20" rx="4" fill="rgba(139, 111, 71, 0.08)" stroke="#3A3935" stroke-width="0.8" />
          <text x="60.5" y="13.5" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" fill="#8B6F47" text-anchor="middle">Product Design</text>
        </g>
  </g>

  <!-- Arrow Link Indicator -->
  <text x="825" y="98" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#8B6F47" text-anchor="end">VIEW REPOSITORY ↗</text>
</svg>