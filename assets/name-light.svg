<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 95" width="100%" height="100%">
  <title>HAMZA TAIF — Designed Typography Name Header</title>
  <style>
    .name-text {
      font-family: ui-monospace, SFMono-Regular, "Roboto Mono", Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 48px;
      font-weight: 900;
      letter-spacing: 8px;
      text-anchor: middle;
    }
    .hamza-part {
      fill: #171613;
      stroke: #171613;
      stroke-width: 1.2px;
    }
    .taif-part {
      fill: #A87932;
      stroke: #A87932;
      stroke-width: 1.2px;
    }
  </style>

  <g transform="translate(350, 64)">
    <text class="name-text">
      <tspan class="hamza-part">HAMZA </tspan><tspan class="taif-part">TAIF</tspan>
    </text>
  </g>
</svg>